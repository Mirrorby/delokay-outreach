name: Telegram first message

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, setup, test, send, enable, pause, notify-test]
        default: check
  workflow_call:
    inputs:
      mode:
        type: string
        default: send
      source_ref:
        type: string
        default: main
    secrets:
      TELEGRAM_API_ID:
        required: true
      TELEGRAM_API_HASH:
        required: true
      TELEGRAM_SESSION:
        required: true
      GOOGLE_SERVICE_ACCOUNT_JSON:
        required: true
      GOOGLE_SHEET_ID:
        required: false

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: telegram-members
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mirrorby/delokay-outreach
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test safeguards
        run: python -m unittest discover -s tests -v
      - name: Run one operation
        env:
          MODE: ${{ inputs.mode || 'check' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || '1fxhzfjbOjd6kJ6-uVQUP6-PVdKsTH9qQOgz4oww-ysc' }}
        run: python outreach.py "$MODE"
